# Runs in the RELEASE repository, marcosudau-vps/led-ctrl-v3.
#
# It is not under .github/workflows/ in the development repository, so it never
# runs there; scripts/sync_release_tree.py puts it in place when it materialises
# the release tree. It lives in the development repository so that it is
# reviewed alongside the code it publishes.
#
# A tag in the release repository is set by the sync workflow and by nothing
# else, which is what makes "tagged here" mean "checked over there".
name: Release
run-name: ${{ github.ref == 'refs/heads/main' && format('Recovery {0} ({1})', inputs.recovery_tag, inputs.publish_recovery && 'publish' || 'verify only') || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      recovery_tag:
        description: Exact existing tag for recovery from main
        type: string
      publish_recovery:
        description: Publish the verified original v3.0.5 distributions
        type: boolean
        default: false

concurrency:
  group: mirror-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Verify the exact pre-tag distributions
    runs-on: ubuntu-latest
    # Belt and braces. A fork of this repository that inherited the workflow
    # would otherwise try to publish to the real project names on the real
    # index, and the failure would be a confusing 403 rather than a skip.
    if: >-
      github.repository == 'marcosudau-vps/led-ctrl-v3' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.recovery_tag == 'v3.0.5'))
    env:
      TAG_REF: ${{ github.ref == 'refs/heads/main' && 'refs/tags/v3.0.5' || github.ref }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.contract.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify original tag objects, CI run and manifest for v3.0.5
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          DEV_REPO: marcosudau-vps/led_controller_respeaker-v3
          DEV_TAG_OBJECT: 576a86e98caa302ffde5ad28c8f1663a9626a473
          DEV_COMMIT: 6bfca277079d5e957811405ef5cbff25f9c71ad8
          DEV_BASE: 36c20d5f4d4d1585c734888a581634357cca7233
          ORIGINAL_RUN: "45918385311"
          ORIGINAL_ARTIFACT: "15162824543"
          ORIGINAL_ZIP_SHA: fe18cab614f934d63204a6d94e509e3d2e44286ec06bce71d0069a090403569b
          MANIFEST_SHA: f1e0bc5f76ebde618f71377c69793ee9892f9c28695dbb9bf07caab7bedf0e86
          MIRROR_TAG_OBJECT: 5e4008dd64efbce209c54505d11c3597ecfce697
          MIRROR_COMMIT: f1f6931628f39cb2031c85d1664b1d1e7b785755
        run: |
          set -euo pipefail

          git fetch --no-tags --refmap= "https://github.com/$DEV_REPO.git" "$TAG_REF"
          test "$(git rev-parse --verify 'FETCH_HEAD^{tag}')" = "$DEV_TAG_OBJECT"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$DEV_COMMIT"
          test "$(git cat-file tag "$DEV_TAG_OBJECT" | sed -n 's/^Release run: //p')" = "$ORIGINAL_RUN"

          git fetch --no-tags --refmap= origin "$TAG_REF"
          test "$(git rev-parse --verify 'FETCH_HEAD^{tag}')" = "$MIRROR_TAG_OBJECT"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$MIRROR_COMMIT"
          test "$(git cat-file tag "$MIRROR_TAG_OBJECT" | sed -n 's/^Development commit: //p')" = "$DEV_COMMIT"
          git checkout --detach "$MIRROR_COMMIT"
          printf '%s  release-manifest.json\n' "$MANIFEST_SHA" | sha256sum --check --strict

          api="https://api.github.com/repos/$DEV_REPO/actions"
          github_get() { curl --fail-with-body --silent --show-error --retry 3 --max-time 30 "$1"; }
          github_get "$api/runs/$ORIGINAL_RUN" | jq -e --arg id "$ORIGINAL_RUN" --arg base "$DEV_BASE" '
            (.id | tostring) == $id and .path == ".github/workflows/patch-release.yml" and
            .event == "workflow_dispatch" and .head_branch == "main" and .head_sha == $base and
            .status == "completed"'
          github_get "$api/runs/$ORIGINAL_RUN/jobs?per_page=100" | jq -e '
            [.jobs[] | select(.conclusion == "success") | .name] as $passed |
            ([
              "Select next patch and create immutable candidate",
              "Test and build exact release candidate / Build, test and package",
              "Test and build exact release candidate / Build and verify Windows Studio executable",
              "Verify all artifacts, tag, publish and mirror"
            ] - $passed) == []'
          github_get "$api/artifacts/$ORIGINAL_ARTIFACT" | jq -e \
            --arg artifact "$ORIGINAL_ARTIFACT" --arg run "$ORIGINAL_RUN" \
            --arg base "$DEV_BASE" --arg digest "sha256:$ORIGINAL_ZIP_SHA" '
            (.id | tostring) == $artifact and .name == "release-pypi" and .digest == $digest and
            .expired == false and (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $base'
          {
            echo "## Recovery of $TAG_REF"
            echo "- Development tag object: $DEV_TAG_OBJECT"
            echo "- Development commit: $DEV_COMMIT"
            echo "- Mirror tag object: $MIRROR_TAG_OBJECT"
            echo "- Mirror commit: $MIRROR_COMMIT"
            echo "- Original CI run: $ORIGINAL_RUN"
            echo "- Original CI artifact: $ORIGINAL_ARTIFACT (SHA-256 $ORIGINAL_ZIP_SHA)"
            echo "- Original manifest SHA-256: $MANIFEST_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read the version out of the tree
        id: version
        run: |
          version=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release tree is at $version"

      - name: The tag has to name the version in the tree
        run: |
          tag="${TAG_REF#refs/tags/v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "tag v$tag does not match tree version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Bind source commit, download files and select publisher matrix
        id: contract
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # checkout may point the local tag ref directly at the peeled commit.
          git fetch --no-tags --refmap= origin "$TAG_REF"
          tag_object=$(git rev-parse --verify 'FETCH_HEAD^{tag}')
          test "$(git rev-parse "${tag_object}^{commit}")" = "$(git rev-parse HEAD)"
          commit=$(git cat-file tag "$tag_object" | sed -n 's/^Development commit: //p')
          matrix=$(python scripts/release_contract.py --version "$VERSION" --commit "$commit")
          python scripts/release_bundle.py fetch release-manifest.json dist --version "$VERSION" --commit "$commit"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Check existing PyPI files before recovery
        if: github.ref == 'refs/heads/main'
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          from release_bundle import load_manifest
          from release_contract import release_projects

          version = "3.0.5"
          commit = "6bfca277079d5e957811405ef5cbff25f9c71ad8"
          manifest = load_manifest(Path("release-manifest.json"), version, commit)
          for project in release_projects(version, commit):
              url = f"https://pypi.org/pypi/{project.name}/{version}/json"
              try:
                  with urlopen(Request(url, headers={"Cache-Control": "no-cache"}), timeout=30) as response:
                      files = json.load(response)["urls"]
              except HTTPError as exc:
                  if exc.code != 404:
                      raise
                  files = []
              allowed = {project.wheel(version), project.sdist(version)}
              for item in files:
                  name = item["filename"]
                  if name not in allowed:
                      raise SystemExit(f"Unexpected PyPI file: {name}")
                  allowed.remove(name)
                  record = {"size": item["size"], "sha256": item["digests"]["sha256"]}
                  if item["yanked"] or record != manifest["files"][name]:
                      raise SystemExit(f"PyPI file differs from original CI: {name}")
              print(f"{project.name}: {len(files)} existing file(s) match original CI")
          PY

      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main' || inputs.publish_recovery
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          overwrite: true

  publish:
    name: ${{ matrix.distribution }} to PyPI
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       inputs.recovery_tag == 'v3.0.5' && inputs.publish_recovery)
    runs-on: ubuntu-latest
    # One environment per project, and each project's trusted publisher on PyPI
    # names its own. That is not tidiness: PyPI refuses a second *pending*
    # publisher with the same owner, repository, workflow and environment, so
    # projects registered ahead of their first upload need distinct environments.
    #
    # It buys something too. An approval rule can now be put on one project
    # without stopping the others, and a publisher is scoped to the one job
    # that may use it rather than to every job in the workflow.
    environment: ${{ matrix.environment }}
    # One job per project, each minting its own short-lived token from its own
    # trusted publisher. Each upload is scoped to its project.
    strategy:
      fail-fast: false
      # One at a time. Parallel uploads are parallel *new projects* the first
      # time a generation is released, and PyPI answers most of them with "429
      # Too many new projects created" — it did, when there were nine of them.
      # Serialised they are far enough apart to get through, and a release
      # takes a couple of minutes longer, which is not a cost.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    permissions:
      # What trusted publishing needs, and the only reason this job has any
      # permissions at all. GitHub mints a short-lived OIDC token, PyPI checks
      # it against the publisher registered for that project, and hands back an
      # upload token good for minutes. Nothing is stored anywhere.
      #
      # For this to resolve, each project must carry a publisher
      # naming owner marcosudau-vps, repository led-ctrl-v3, workflow
      # release.yml and the environment from the release contract. A project that
      # does not exist yet takes a *pending* publisher on the account that
      # should own it; a project that already exists takes one under its own
      # publishing settings, which only an owner of that project can add.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Keep only this project's files
        run: |
          mkdir -p upload
          mv dist/${{ matrix.distribution }}-*.whl upload/
          mv dist/${{ matrix.distribution }}-*.tar.gz upload/
          ls -l upload

      # No password and no token: with id-token: write and nothing given here,
      # the action does the OIDC exchange by itself. Adding a password would
      # silently switch that off again, and take PEP 740 attestations with it.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          # Makes a half-finished release resumable. PyPI refuses a file it
          # already has, so without this, re-running after a partial failure
          # fails again on everything that did work — and the only way forward
          # would be a version nobody needed. With it, the run can simply be
          # repeated until all projects are up. It cannot mask a mistake: the
          # version is new on every release, so there is nothing to skip.
          skip-existing: true
